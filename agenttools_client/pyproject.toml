[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agenttools-client"
version = "0.2.0"
description = "Self-healing Python client for Tools for Agents — M2M / A2A API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tools for Agents", email = "support@toolsforagents.tools" }]
keywords = ["ai", "agents", "llm", "mcp", "a2a", "api-client", "tools-for-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://toolsforagents.tools"
Documentation = "https://toolsforagents.tools/docs/guide"
Repository = "https://github.com/max124vip-dev/tools-for-agents"
Issues = "https://github.com/max124vip-dev/tools-for-agents/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["agenttools_client"]

[tool.hatch.build.targets.sdist]
include = [
    "agenttools_client/**/*.py",
    "README.md",
    "pyproject.toml",
]
